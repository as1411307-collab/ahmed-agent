name: Tests
on:
  push:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -e . || pip install pytest pytest-asyncio httpx pydantic pydantic-ai asyncpg fastembed
      - name: Run tests
        run: pytest tests/ -q
        continue-on-error: true
