[project]
name = "ahmed-agent"
version = "1.0.0"
description = "Ahmed Agent — single-owner personal AI agent (Starlette + PydanticAI + PostgreSQL)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastembed>=0.8.0",
    "mcp>=2.1.1",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.42.0",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
    "starlette>=1.6.0",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.ruff.lint]
# Real defects only: syntax errors, undefined names, unused imports/vars --
# not a style linter. See CLAUDE.md's "Handling automated review findings"
# for why this is scoped this narrowly.
select = ["E9", "F63", "F7", "F82", "F401", "F841"]

[tool.ruff.lint.per-file-ignores]
# Wave 3 (#8) re-export facades: their "unused" imports are the public API
# other modules import from them, not dead code.
"persistence.py" = ["F401"]
"agent_core.py" = ["F401"]
"evaluation_baseline.py" = ["F401"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "persistence_docs",
    "persistence_audit",
    "persistence_events",
    "persistence_runs",
    "persistence_core",
    "eval_grading",
    "eval_metrics",
    "eval_exec",
    "eval_http",
    "eval_tools",
    "eval_schema",
    "agent_runtime",
    "agent_providers",
    "agent_evidence",
    "agent_consts",
    "academic_benchmark",
    "academic_search",
    "agent_core",
    "alerting",
    "architecture_evidence",
    "auth",
    "config",
    "doctor",
    "embeddings",
    "evaluation_aa_rc_002",
    "evaluation_aa_rc_026",
    "evaluation_baseline",
    "evaluation_source_bindings",
    "evidence_citations",
    "evidence_core",
    "github_search",
    "github_smoke",
    "independent_semantic_evaluator",
    "my_files",
    "original_source_storage",
    "persistence",
    "policy",
    "request_routing",
    "run_state",
    "runtime_evidence",
    "search_benchmark",
    "search_fabric",
    "semantic_evaluation",
    "server",
    "skill_tools",
    "source_of_truth",
    "source_status",
]
